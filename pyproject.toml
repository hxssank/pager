[project]
name = "pager-mechanical"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadquery==2.6.1",
    "trimesh==4.9.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["mechanical"]

[tool.ruff]
target-version = "py312"

